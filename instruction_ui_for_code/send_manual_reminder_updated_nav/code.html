<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Send Manual Reminder - Dormitory Manager</title>
<!-- Google Fonts: Public Sans -->
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#dbe1ff",
                    "secondary-container": "#7cf994",
                    "tertiary-fixed": "#ffdad6",
                    "primary": "#004ac6",
                    "outline": "#737686",
                    "on-tertiary-fixed-variant": "#93000b",
                    "primary-container": "#2563eb",
                    "surface-container-low": "#eef4ff",
                    "secondary-fixed-dim": "#62df7d",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#27313e",
                    "surface-container-highest": "#d9e3f4",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed": "#410002",
                    "tertiary": "#ae0010",
                    "surface-dim": "#d1dbec",
                    "on-secondary-container": "#007230",
                    "on-surface": "#121c28",
                    "tertiary-container": "#d52022",
                    "surface": "#f8f9ff",
                    "outline-variant": "#c3c6d7",
                    "surface-tint": "#0053db",
                    "surface-variant": "#d9e3f4",
                    "on-primary-fixed": "#00174b",
                    "tertiary-fixed-dim": "#ffb4ab",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f8f9ff",
                    "on-secondary-fixed": "#002109",
                    "on-surface-variant": "#434655",
                    "on-primary-container": "#eeefff",
                    "on-background": "#121c28",
                    "secondary-fixed": "#7ffc97",
                    "surface-container": "#e5eeff",
                    "on-secondary-fixed-variant": "#005320",
                    "on-secondary": "#ffffff",
                    "background": "#f8f9ff",
                    "inverse-on-surface": "#eaf1ff",
                    "error": "#ba1a1a",
                    "secondary": "#006e2d",
                    "inverse-primary": "#b4c5ff",
                    "on-tertiary-container": "#ffecea",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "surface-container-high": "#dfe9fa",
                    "on-primary-fixed-variant": "#003ea8"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Public Sans"],
                    "body": ["Public Sans"],
                    "label": ["Public Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        /* No-Line Philosophy: Hide standard borders, use spacing and tonal layers */
        .tonal-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar - Small Type -->
<header class="bg-white dark:bg-slate-950 flex items-center justify-between px-6 py-6 w-full fixed top-0 z-50">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-150 text-blue-600 dark:text-blue-400">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline tracking-tight text-xl font-bold text-slate-900 dark:text-slate-50">Send Reminder</h1>
</div>
<button class="active:scale-95 duration-150 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
</header>
<main class="pt-24 px-6 space-y-8 max-w-md mx-auto">
<!-- Recipient Info: Confident, Editorial Scale -->
<section class="mt-4">
<div class="bg-surface-container-low p-6 rounded-[2rem] flex items-center gap-4">
<div class="w-14 h-14 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div>
<p class="text-on-surface-variant font-medium text-sm">Recipient</p>
<h2 class="text-xl font-bold text-on-surface">Johnathan Doe <span class="text-primary font-medium">(Room 101)</span></h2>
</div>
</div>
</section>
<!-- Section 1: Select Channel -->
<section class="space-y-4">
<h3 class="text-on-surface-variant font-bold text-sm uppercase tracking-widest px-1">Select Channel</h3>
<div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
<!-- Active Item: LINE -->
<button class="flex items-center gap-2 px-6 py-4 bg-primary text-on-primary rounded-2xl font-bold active:scale-95 transition-transform">
<span class="material-symbols-outlined text-xl">chat</span>
<span>LINE</span>
</button>
<!-- Inactive Item: SMS -->
<button class="flex items-center gap-2 px-6 py-4 bg-surface-container-high text-on-surface rounded-2xl font-semibold active:scale-95 transition-transform">
<span class="material-symbols-outlined text-xl">sms</span>
<span>SMS</span>
</button>
<!-- Inactive Item: App Push -->
<button class="flex items-center gap-2 px-6 py-4 bg-surface-container-high text-on-surface rounded-2xl font-semibold active:scale-95 transition-transform">
<span class="material-symbols-outlined text-xl">notifications</span>
<span>App Push</span>
</button>
</div>
</section>
<!-- Section 2: Message Template -->
<section class="space-y-4">
<label class="text-on-surface-variant font-bold text-sm uppercase tracking-widest px-1">Message Template</label>
<div class="relative group">
<select class="w-full h-16 px-6 bg-surface-container-lowest border-none appearance-none rounded-2xl text-on-surface font-semibold shadow-[0_4px_20px_rgba(0,0,0,0.03)] focus:ring-2 focus:ring-primary/20">
<option selected="" value="late-rent">Late Rent Payment</option>
<option value="maintenance">Water Maintenance</option>
<option value="utility">Utility Bill Ready</option>
</select>
<div class="absolute right-6 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">unfold_more</span>
</div>
</div>
</section>
<!-- Section 3: Message Preview -->
<section class="space-y-4">
<div class="flex justify-between items-end px-1">
<label class="text-on-surface-variant font-bold text-sm uppercase tracking-widest">Message Preview</label>
<span class="text-on-surface-variant/60 text-xs font-medium">104 / 240 chars</span>
</div>
<div class="bg-surface-container-lowest rounded-[1.5rem] p-6 shadow-[0_10px_40px_rgba(0,0,0,0.04)]">
<textarea class="w-full min-h-[160px] border-none p-0 bg-transparent text-lg leading-relaxed text-on-surface focus:ring-0 resize-none font-medium" placeholder="Type your message here...">Hello Johnathan, your rent for April 2026 is currently overdue. Please settle your payment of ฿ 4,500. Thank you.</textarea>
<!-- Attachment/Meta Row -->
<div class="mt-6 pt-6 border-t border-surface-container flex items-center justify-between">
<div class="flex items-center gap-2 text-secondary font-bold">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">attach_file</span>
<span class="text-xs">Invoice_Apr26.pdf</span>
</div>
<button class="text-primary text-xs font-bold uppercase tracking-wider">Edit Tags</button>
</div>
</div>
</section>
<!-- Primary Action -->
<section class="pt-4">
<button class="w-full h-16 bg-gradient-to-b from-primary to-primary-container text-on-primary rounded-2xl font-extrabold text-lg shadow-[0_20px_50px_rgba(0,74,198,0.2)] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span>Send Reminder Now</span>
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
<p class="text-center text-on-surface-variant/60 text-xs mt-4">Recipient will receive a notification instantly on LINE.</p>
</section>
</main>
<!-- BottomNavBar - Execution based on JSON -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50 rounded-t-3xl"><!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-2xl px-5 py-2 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-public-sans text-sm font-medium">Home</span>
</a>
<!-- Billing -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-blue-500 dark:hover:text-blue-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-public-sans text-sm font-medium">Billing</span>
</a>
<!-- Services -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-blue-500 dark:hover:text-blue-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="room_service">room_service</span>
<span class="font-public-sans text-sm font-medium">Services</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-blue-500 dark:hover:text-blue-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-public-sans text-sm font-medium">Settings</span>
</a></nav>
</body></html>
