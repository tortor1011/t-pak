<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bulk Room Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-high": "#dfe9fa",
                        "on-primary-container": "#eeefff",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-fixed-variant": "#93000b",
                        "secondary": "#006e2d",
                        "on-tertiary-fixed": "#410002",
                        "secondary-container": "#7cf994",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#00174b",
                        "primary-container": "#2563eb",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#62df7d",
                        "tertiary-fixed-dim": "#ffb4ab",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c3c6d7",
                        "surface-container-low": "#eef4ff",
                        "secondary-fixed": "#7ffc97",
                        "inverse-primary": "#b4c5ff",
                        "on-surface-variant": "#434655",
                        "on-secondary-container": "#007230",
                        "tertiary-fixed": "#ffdad6",
                        "surface-dim": "#d1dbec",
                        "on-primary": "#ffffff",
                        "primary": "#004ac6",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-tint": "#0053db",
                        "surface-container": "#e5eeff",
                        "on-surface": "#121c28",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary-fixed": "#dbe1ff",
                        "on-error": "#ffffff",
                        "surface": "#f8f9ff",
                        "tertiary-container": "#d52022",
                        "tertiary": "#ae0010",
                        "on-tertiary-container": "#ffecea",
                        "background": "#f8f9ff",
                        "on-secondary-fixed-variant": "#005320",
                        "surface-bright": "#f8f9ff",
                        "on-background": "#121c28",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d9e3f4",
                        "surface-variant": "#d9e3f4",
                        "inverse-on-surface": "#eaf1ff",
                        "outline": "#737686",
                        "inverse-surface": "#27313e",
                        "on-secondary-fixed": "#002109"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col md:hidden">
<!-- TopAppBar from JSON -->
<header class="bg-white dark:bg-slate-900 shadow-[0_20px_50px_rgba(18,28,40,0.05)] docked full-width top-0 z-10 flex justify-between items-center w-full px-6 py-4">
<button class="text-blue-600 dark:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-slate-900 dark:text-slate-50 font-headline">Bulk Room Setup</h1>
<button class="text-blue-600 dark:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help_outline</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col pt-4 pb-[340px] px-6">
<!-- Floor Selector -->
<div class="mb-8">
<h2 class="text-lg font-bold font-headline mb-4 text-on-surface">Select Floor</h2>
<div class="flex space-x-3 overflow-x-auto pb-2 scrollbar-hide">
<button class="flex-shrink-0 px-6 py-3 rounded-xl bg-primary text-on-primary font-bold text-base shadow-[0_4px_14px_rgba(0,74,198,0.2)]">Floor 1</button>
<button class="flex-shrink-0 px-6 py-3 rounded-xl bg-surface-container-highest text-on-surface-variant font-medium text-base hover:bg-surface-dim transition-colors">Floor 2</button>
<button class="flex-shrink-0 px-6 py-3 rounded-xl bg-surface-container-highest text-on-surface-variant font-medium text-base hover:bg-surface-dim transition-colors">Floor 3</button>
<button class="flex-shrink-0 px-6 py-3 rounded-xl bg-surface-container-highest text-on-surface-variant font-medium text-base hover:bg-surface-dim transition-colors">Floor 4</button>
</div>
</div>
<!-- Selection Grid -->
<div>
<div class="flex justify-between items-center mb-4">
<h2 class="text-lg font-bold font-headline text-on-surface">Select Rooms</h2>
<button class="text-primary font-bold text-sm hover:underline">Select All</button>
</div>
<div class="grid grid-cols-3 gap-4">
<!-- Selected Rooms (101-110) -->
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">101</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">102</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">103</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">104</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">105</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">106</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">107</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">108</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">109</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="aspect-square rounded-xl bg-primary-container text-on-primary-container flex flex-col items-center justify-center relative shadow-sm border-2 border-primary">
<span class="font-bold text-lg">110</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Unselected Rooms (111-112) -->
<button class="aspect-square rounded-xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center border-2 border-outline-variant border-opacity-30 hover:bg-surface-container-low transition-colors">
<span class="font-bold text-lg">111</span>
</button>
<button class="aspect-square rounded-xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center border-2 border-outline-variant border-opacity-30 hover:bg-surface-container-low transition-colors">
<span class="font-bold text-lg">112</span>
</button>
</div>
</div>
</main>
<!-- Overlay / Bottom Sheet for Bulk Actions -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-[1.5rem] shadow-[0_-20px_50px_rgba(18,28,40,0.1)] z-20 px-6 pt-6 pb-8 border-t border-surface-container-low">
<!-- Drag Handle Indicator -->
<div class="w-12 h-1.5 bg-outline-variant rounded-full mx-auto mb-6 opacity-50"></div>
<div class="flex items-center justify-between mb-6">
<h2 class="text-2xl font-bold font-headline text-on-surface">10 Rooms Selected</h2>
<button class="text-on-surface-variant p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="space-y-5 mb-8">
<!-- Base Rent Input -->
<div class="flex flex-col">
<label class="text-sm font-bold text-on-surface-variant mb-2 ml-1">Base Rent (THB)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant font-medium">฿</span>
<input class="w-full h-14 pl-10 pr-4 rounded-xl bg-surface-container-low border-none text-on-surface text-lg font-semibold focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" type="text" value="5,000"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Electricity Rate Input -->
<div class="flex flex-col">
<label class="text-sm font-bold text-on-surface-variant mb-2 ml-1">Electricity Rate</label>
<div class="relative">
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none text-on-surface text-lg font-semibold focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" type="text" value="8.00"/>
<span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant text-sm">/unit</span>
</div>
</div>
<!-- Water Rate Input -->
<div class="flex flex-col">
<label class="text-sm font-bold text-on-surface-variant mb-2 ml-1">Water Rate</label>
<div class="relative">
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none text-on-surface text-lg font-semibold focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" type="text" value="18.00"/>
<span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant text-sm">/unit</span>
</div>
</div>
</div>
</div>
<button class="w-full h-14 rounded-xl bg-gradient-to-b from-primary to-primary-container text-on-primary font-bold text-lg flex items-center justify-center shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all">
            Apply to Selected Rooms
        </button>
</div>
</body></html>
