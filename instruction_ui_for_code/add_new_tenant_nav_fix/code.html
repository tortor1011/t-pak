<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Move-in: Room 105 - Dormitory Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "outline": "#737686",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#d52022",
              "surface": "#f8f9ff",
              "on-surface": "#121c28",
              "on-tertiary-fixed-variant": "#93000b",
              "on-primary-container": "#eeefff",
              "on-primary": "#ffffff",
              "on-error": "#ffffff",
              "error": "#ba1a1a",
              "surface-tint": "#0053db",
              "secondary-fixed-dim": "#62df7d",
              "surface-variant": "#d9e3f4",
              "secondary-container": "#7cf994",
              "on-surface-variant": "#434655",
              "surface-container-high": "#dfe9fa",
              "secondary": "#006e2d",
              "outline-variant": "#c3c6d7",
              "primary-fixed-dim": "#b4c5ff",
              "on-primary-fixed": "#00174b",
              "surface-container-highest": "#d9e3f4",
              "inverse-surface": "#27313e",
              "primary-fixed": "#dbe1ff",
              "surface-container": "#e5eeff",
              "secondary-fixed": "#7ffc97",
              "on-primary-fixed-variant": "#003ea8",
              "inverse-primary": "#b4c5ff",
              "on-secondary-container": "#007230",
              "on-background": "#121c28",
              "on-secondary-fixed": "#002109",
              "tertiary-fixed-dim": "#ffb4ab",
              "tertiary-fixed": "#ffdad6",
              "error-container": "#ffdad6",
              "primary": "#004ac6",
              "on-secondary-fixed-variant": "#005320",
              "background": "#f8f9ff",
              "on-tertiary-fixed": "#410002",
              "on-error-container": "#93000a",
              "on-tertiary-container": "#ffecea",
              "surface-container-lowest": "#ffffff",
              "on-secondary": "#ffffff",
              "tertiary": "#ae0010",
              "surface-dim": "#d1dbec",
              "surface-bright": "#f8f9ff",
              "primary-container": "#2563eb",
              "surface-container-low": "#eef4ff",
              "inverse-on-surface": "#eaf1ff"
            },
            fontFamily: {
              "headline": ["Public Sans"],
              "body": ["Public Sans"],
              "label": ["Public Sans"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Public Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-40 bg-white dark:bg-gray-950">
<div class="flex items-center px-4 h-16 w-full max-w-7xl mx-auto">
<button class="mr-4 p-2 transition-colors duration-200 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-400">arrow_back</span>
</button>
<h1 class="font-public-sans font-bold text-xl text-blue-600 dark:text-blue-400">Move-in: Room 105</h1>
</div>
</header>
<main class="px-4 py-6 space-y-6 max-w-md mx-auto">
<!-- Section 1: Tenant Information -->
<section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_10px_30px_rgba(18,28,40,0.03)]">
<div class="flex items-center space-x-4 mb-6">
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center border-2 border-dashed border-outline-variant relative overflow-hidden group">
<span class="material-symbols-outlined text-outline text-3xl">camera_alt</span>
<div class="absolute inset-0 bg-black/5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-tighter">Upload</span>
</div>
</div>
<div class="flex-1">
<h2 class="text-lg font-bold text-on-surface mb-1 leading-tight">Tenant Information</h2>
<p class="text-on-surface-variant text-sm">Personal identity details</p>
</div>
</div>
<div class="space-y-4">
<div>
<label class="block text-sm font-bold text-on-surface mb-2">Full Name</label>
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary text-body-lg" placeholder="e.g., Somchai Rakdee" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-bold text-on-surface mb-2">Phone Number</label>
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary" placeholder="081-234-5678" type="tel"/>
</div>
<div>
<label class="block text-sm font-bold text-on-surface mb-2">Line ID</label>
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary" placeholder="@id" type="text"/>
</div>
</div>
<button class="w-full py-4 px-4 rounded-xl bg-secondary-container text-on-secondary-container font-bold text-sm flex items-center justify-center space-x-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-lg">badge</span>
<span>Upload ID Card Photo</span>
</button>
</div>
</section>
<!-- Section 2: Contract Details -->
<section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_10px_30px_rgba(18,28,40,0.03)]">
<h2 class="text-lg font-bold text-on-surface mb-4">Contract Details</h2>
<div class="space-y-4">
<div>
<label class="block text-sm font-bold text-on-surface mb-2">Contract Duration</label>
<select class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary appearance-none">
<option>1 Year</option>
<option>6 Months</option>
<option>Monthly (Rolling)</option>
</select>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-bold text-on-surface mb-2">Start Date</label>
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary" type="date"/>
</div>
<div>
<label class="block text-sm font-bold text-on-surface mb-2">End Date</label>
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary" type="date"/>
</div>
</div>
<div class="flex items-start space-x-2 p-3 bg-primary/5 rounded-xl">
<span class="material-symbols-outlined text-primary text-lg mt-0.5">info</span>
<p class="text-xs text-primary font-medium leading-relaxed">Rent will be billed on the 1st of each month</p>
</div>
</div>
</section>
<!-- Section 3: Financials -->
<section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_10px_30px_rgba(18,28,40,0.03)]">
<h2 class="text-lg font-bold text-on-surface mb-4">Financials</h2>
<div class="space-y-6">
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-bold text-on-surface mb-2">Base Rent (THB)</label>
<div class="relative">
<input class="w-full h-14 pl-4 pr-10 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary font-bold" placeholder="5,500" type="number"/>
</div>
</div>
<div>
<label class="block text-sm font-bold text-on-surface mb-2">Security Deposit</label>
<div class="relative">
<input class="w-full h-14 pl-4 pr-10 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary font-bold" placeholder="11,000" type="number"/>
</div>
</div>
</div>
<div class="pt-4 border-t border-surface-container">
<h3 class="text-sm font-bold text-on-surface-variant uppercase tracking-wider mb-4">Utility Starting Meters</h3>
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-4 rounded-xl">
<label class="flex items-center space-x-2 text-xs font-bold text-on-surface-variant mb-2">
<span class="material-symbols-outlined text-sm text-blue-500">bolt</span>
<span>Electricity</span>
</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-xl font-extrabold text-on-surface" placeholder="000.0" type="number"/>
</div>
<div class="bg-surface-container-low p-4 rounded-xl">
<label class="flex items-center space-x-2 text-xs font-bold text-on-surface-variant mb-2">
<span class="material-symbols-outlined text-sm text-cyan-500">water_drop</span>
<span>Water</span>
</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-xl font-extrabold text-on-surface" placeholder="000.0" type="number"/>
</div>
</div>
</div>
</div>
</section>
<!-- Primary Action -->
<div class="pt-4 px-2">
<button class="w-full h-[56px] rounded-xl bg-gradient-to-b from-primary to-primary-container text-on-primary font-bold text-lg shadow-[0_10px_30px_rgba(0,74,198,0.25)] active:scale-95 transition-transform">
                Create Profile &amp; Generate Lease
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shadow-[0_-10px_40px_rgba(18,28,40,0.05)] rounded-t-3xl">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed px-5 py-2 scale-95 active:scale-90 transition-transform rounded-2xl" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-public-sans text-xs font-medium">Home</span>
</a>
<!-- Billing -->
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-5 py-2 hover:bg-gray-200/50 dark:hover:bg-gray-800/50 scale-95 active:scale-90 transition-transform rounded-2xl" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-public-sans text-xs font-medium">Billing</span>
</a>
<!-- Services -->
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-5 py-2 hover:bg-gray-200/50 dark:hover:bg-gray-800/50 scale-95 active:scale-90 transition-transform rounded-2xl" href="#">
<span class="material-symbols-outlined">room_service</span>
<span class="font-public-sans text-xs font-medium">Services</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-5 py-2 hover:bg-gray-200/50 dark:hover:bg-gray-800/50 scale-95 active:scale-90 transition-transform rounded-2xl" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-public-sans text-xs font-medium">Profile</span>
</a>
</nav>
</body></html>
