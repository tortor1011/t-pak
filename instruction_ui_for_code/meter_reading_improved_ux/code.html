<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Meter Reading - Room 101</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#005320",
                        "secondary": "#006e2d",
                        "on-tertiary-fixed-variant": "#93000b",
                        "secondary-fixed-dim": "#62df7d",
                        "primary-fixed": "#dbe1ff",
                        "on-surface-variant": "#434655",
                        "on-primary-container": "#eeefff",
                        "outline-variant": "#c3c6d7",
                        "surface-dim": "#d1dbec",
                        "outline": "#737686",
                        "error": "#ba1a1a",
                        "primary": "#004ac6",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b4c5ff",
                        "surface-bright": "#f8f9ff",
                        "inverse-surface": "#27313e",
                        "on-background": "#121c28",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-surface": "#121c28",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#d9e3f4",
                        "on-secondary-fixed": "#002109",
                        "surface-variant": "#d9e3f4",
                        "primary-container": "#2563eb",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#007230",
                        "on-primary-fixed": "#00174b",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container": "#e5eeff",
                        "tertiary-fixed-dim": "#ffb4ab",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#0053db",
                        "secondary-container": "#7cf994",
                        "tertiary-container": "#d52022",
                        "secondary-fixed": "#7ffc97",
                        "surface": "#f8f9ff",
                        "on-tertiary-container": "#ffecea",
                        "background": "#f8f9ff",
                        "on-tertiary-fixed": "#410002",
                        "tertiary-fixed": "#ffdad6",
                        "surface-container-high": "#dfe9fa",
                        "tertiary": "#ae0010",
                        "surface-container-low": "#eef4ff"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #f8f9ff;
            color: #121c28;
            -webkit-tap-highlight-color: transparent;
        }
        .scanner-viewport::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="white"/><rect x="10%" y="20%" width="80%" height="60%" rx="24" fill="black"/></svg>');
            -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="white"/><rect x="10%" y="20%" width="80%" height="60%" rx="24" fill="black"/></svg>');
        }
        .glow-blue {
            filter: drop-shadow(0 0 4px rgba(0, 74, 198, 0.6));
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 docked full-width top-0 sticky z-50 flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="transition-colors duration-200 hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-400">arrow_back</span>
</button>
<h1 class="font-public-sans font-bold text-xl text-slate-900 dark:text-slate-100">Meter Reading</h1>
</div>
<div class="flex items-center">
<button class="transition-colors duration-200 hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-slate-500">history</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col pb-32">
<!-- Room Selector / Context Header -->
<section class="px-6 pt-4 pb-2 flex justify-between items-end">
<div>
<span class="text-on-surface-variant font-medium text-sm block mb-1">Dormitory A • Floor 1</span>
<h2 class="text-4xl font-extrabold tracking-tight text-on-surface">Room 101</h2>
</div>
<!-- Minimal dropdown selector -->
<button class="flex items-center gap-1 bg-surface-container-high px-4 py-2 rounded-lg font-bold text-on-surface-variant transition-colors active:bg-surface-container-highest">
<span>Rm 101</span>
<span class="material-symbols-outlined text-lg">arrow_drop_down</span>
</button>
</section>
<!-- Camera OCR Area -->
<section class="mt-6 px-6">
<div class="relative w-full aspect-[4/3] rounded-[2rem] overflow-hidden bg-slate-900 shadow-2xl group">
<!-- Mock Camera Feed -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="Close-up photo of a digital utility meter with glowing red numbers inside a utility box with industrial wiring" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCm3lfkU-6JE9OFYasGv150om7Ls7SQRNDgHSIR-abW9xmWIpjV2QKNnxeOfIqZqtrO2ebtQ3NNVHVthJIzgho-FaCx92S3-g1W7MX26BsXsxt3OS9jvuyqWMBruWpuJqxrjwGqWBf3JFbwv-28id5-uCDKlfVyyue3D-l-4HqtIGYEldZcqDvpE3OK6kbF9P4DYh63gMTQlgFJEQ4kKUFt04kXhDiDJ608rdPIHpmgk1BXlRJtHwyTtBVN-MkLmDxahJPZ0HAtkWfn')"></div>
<!-- Scanner Viewport Overlay -->
<div class="absolute inset-0 scanner-viewport"></div>
<!-- Corner Guides with Blue Glow -->
<div class="absolute top-[20%] left-[10%] w-12 h-12 border-t-4 border-l-4 border-primary/80 rounded-tl-3xl glow-blue"></div>
<div class="absolute top-[20%] right-[10%] w-12 h-12 border-t-4 border-r-4 border-primary/80 rounded-tr-3xl glow-blue"></div>
<div class="absolute bottom-[20%] left-[10%] w-12 h-12 border-b-4 border-l-4 border-primary/80 rounded-bl-3xl glow-blue"></div>
<div class="absolute bottom-[20%] right-[10%] w-12 h-12 border-b-4 border-r-4 border-primary/80 rounded-br-3xl glow-blue"></div>
<!-- Flashlight -->
<div class="absolute top-6 right-6">
<button class="w-14 h-14 bg-black/30 backdrop-blur-xl text-white rounded-full flex items-center justify-center border border-white/20 active:bg-white/20 transition-all">
<span class="material-symbols-outlined text-3xl">flashlight_on</span>
</button>
</div>
<!-- Instruction Text -->
<div class="absolute inset-x-0 bottom-1/2 translate-y-1/2 flex flex-col items-center pointer-events-none">
<div class="bg-white/70 backdrop-blur-sm px-3 py-1 rounded-full text-slate-700 font-medium text-[10px] tracking-wider uppercase mb-2">Align Meter</div>
<div class="w-[70%] h-1 bg-primary/20 rounded-full overflow-hidden">
<div class="h-full bg-primary/60 w-2/3"></div>
</div>
</div>
</div>
</section>
<!-- Manual Input Area -->
<section class="mt-10 px-6 space-y-8">
<!-- Electricity Meter -->
<div class="flex flex-col">
<div class="flex justify-between items-center mb-3">
<label class="text-on-surface font-bold text-lg flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-weight="fill">bolt</span>
                        Electricity Meter
                    </label>
<span class="bg-surface-container-high px-3 py-1 rounded-full text-xs font-bold text-on-surface-variant">kWh</span>
</div>
<div class="relative">
<!-- Highlighted Input: Blue border and tint -->
<input class="w-full h-20 bg-blue-50/50 border-2 border-primary/30 rounded-2xl px-6 text-3xl font-extrabold focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-outline-variant shadow-sm text-on-surface" placeholder="0000.0" step="0.1" type="number"/>
</div>
<div class="mt-2 flex items-center gap-1.5 text-on-surface-variant/60 font-medium">
<span class="material-symbols-outlined text-sm">history</span>
<p class="text-sm">Previous: 1,234.5</p>
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-primary">edit</span>
</button>
</div>
</div>
<!-- Water Meter -->
<div class="flex flex-col opacity-60">
<!-- De-emphasized state -->
<div class="flex justify-between items-center mb-3">
<label class="text-on-surface font-bold text-lg flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-weight="fill">water_drop</span>
                        Water Meter
                    </label>
<span class="bg-surface-container-high px-3 py-1 rounded-full text-xs font-bold text-on-surface-variant">m³</span>
</div>
<div class="relative">
<input class="w-full h-20 bg-surface-container-lowest border-none rounded-2xl px-6 text-3xl font-extrabold focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-outline-variant shadow-sm text-on-surface" placeholder="0000.0" step="0.1" type="number"/>
</div>
<div class="mt-2 flex items-center gap-1.5 text-on-surface-variant/60 font-medium">
<span class="material-symbols-outlined text-sm">history</span>
<p class="text-sm">Previous: 1,234.5</p>
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-primary">edit</span>
</button>
</div>
</div>
</section>
</main>
<!-- Footer Action -->
<div class="fixed bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-background via-background to-transparent z-40">
<button class="w-full h-[64px] bg-gradient-to-b from-primary to-primary-container text-on-primary rounded-2xl font-bold text-lg shadow-[0_20px_50px_rgba(18,28,40,0.15)] active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">exit_to_app</span>
            Save Readings &amp; Next Room
        </button>
</div>
</body></html>
